name: MicroAlbert — publication GitHub Pages

on:
  push:
    branches: [feature/g4-github-pages-preview]

permissions:
  contents: read

concurrency:
  group: microalbert-pages
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: printf '%s\n' "$GITHUB_SHA" > dist/revision.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: pages
      - name: Vérifier la révision publiée
        env:
          PAGE_URL: ${{ steps.pages.outputs.page_url }}
        run: |
          for tentative in {1..12}; do
            revision="$(curl -fsS --max-time 10 "${PAGE_URL%/}/revision.txt?ref=$GITHUB_SHA" || true)"
            if [[ "$revision" == "$GITHUB_SHA" ]]; then exit 0; fi
            sleep 5
          done
          exit 1
