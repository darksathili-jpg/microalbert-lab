name: G0 teacher guide browser
on:
  pull_request:
    paths:
      - 'docs/enseignants/**'
      - 'tests/e2e/**'
      - 'playwright.config.cjs'
      - 'package.json'
      - '.github/workflows/g0-guide-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p artifacts
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microalbert-g0-guide-evidence
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 14
