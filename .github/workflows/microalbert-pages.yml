name: MicroAlbert - publication GitHub Pages

on:
  push:
    branches: [feature/g4-github-pages-preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: microalbert-github-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Compiler et vérifier avant publication
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer frontend
        run: npm ci --prefix frontend
      - name: Sélectionner explicitement l'entrée publique
        run: |
          cp frontend/index-public.html frontend/index.html
          grep -q 'src="/src/main-public.tsx"' frontend/index.html
          if grep -q 'src="/src/main.tsx"' frontend/index.html; then
            echo "ECHEC : entrée complète détectée"
            exit 1
          fi
      - name: Compiler la version publique isolée
        run: npm run build --prefix frontend -- --mode public-demo
      - name: Vérifier les artefacts
        run: python3 scripts/check_staging_artifacts.py
      - name: Vérifier le périmètre du bundle public
        run: python3 scripts/check_public_demo.py
      - name: Installer le banc de tests navigateur
        run: npm install --no-save --no-package-lock
      - name: Installer Chromium pour la recette
        run: npx playwright install --with-deps chromium
      - name: Tester le véritable build GitHub Pages
        run: npx playwright test --config=playwright.public-pages.config.cjs
      - name: Préserver les journaux de test en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: microalbert-pages-test-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Préparer les artefacts GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Publier après vérifications
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Vérifier le site publié et ses ressources
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://darksathili-jpg.github.io/microalbert-lab/"
          for attempt in $(seq 1 12); do
            echo "Contrôle du site publié — tentative ${attempt}/12"
            if curl --fail --location --silent --show-error --max-time 15 "$SITE" -o /tmp/microalbert-live.html; then
              ASSET=$(grep -oE 'src="/microalbert-lab/assets/[^"]+\.js"' /tmp/microalbert-live.html | head -n 1 | cut -d '"' -f 2 || true)
              if [[ -n "$ASSET" ]] && curl --fail --location --silent --show-error --max-time 15 "https://darksathili-jpg.github.io$ASSET" -o /tmp/microalbert-live.js; then
                if grep -q 'student-heading' /tmp/microalbert-live.js && curl --fail --location --silent --show-error --max-time 15 "${SITE}pyodide/pyodide.js" -o /dev/null; then
                  echo "Site public, JavaScript et moteur Pyodide accessibles."
                  exit 0
                fi
              fi
            fi
            if [[ "$attempt" -lt 12 ]]; then sleep 10; fi
          done
          echo "::error::Le site publié ne présente pas toutes les ressources attendues."
          exit 1

