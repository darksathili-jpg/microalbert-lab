name: MicroAlbert - previsualisation privee (activation bloquee)

# Ce workflow NE publie RIEN tant que l'administrateur n'a pas configure
# le projet Pages, Cloudflare Access sur TOUS les domaines et aliases,
# les secrets, l'environnement protege et la variable d'activation.
on:
  workflow_run:
    workflows: ["MicroAlbert - verification continue"]
    types: [completed]
    branches: [feature/g4-infra-01-ci]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microalbert-private-preview
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      ${{ vars.MICROALBERT_PRIVATE_PREVIEW_ENABLED == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'feature/g4-infra-01-ci')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: microalbert-private-preview
    steps:
      - name: Verifier la configuration de protection
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          ACCESS_CONFIRMED: ${{ vars.MICROALBERT_ACCESS_ALL_HOSTNAMES_VERIFIED }}
        run: |
          test -n "$CF_ACCOUNT_ID" && test -n "$CF_API_TOKEN" && test -n "$CF_PROJECT"
          test "$ACCESS_CONFIRMED" = "true" || { echo "STOP: protection Access non attestee"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dependances verrouillees
        run: npm ci --prefix frontend
      - name: Construire uniquement la variante eleves
        env:
          VITE_STUDENT_STAGING: 'true'
        run: npm run build --prefix frontend
      - name: Verifier les artefacts
        run: python3 scripts/check_staging_artifacts.py
      - name: Publier sur Cloudflare Pages (seulement apres approbation)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: npx --yes wrangler@3 pages deploy frontend/dist --project-name "$CF_PROJECT" --branch private-preview
